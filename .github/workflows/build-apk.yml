
name: Build SHESHCO APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir unpacked
          unzip -q SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip -d unpacked
          PROJECT_DIR="$(dirname "$(find unpacked -name settings.gradle -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHESHCO-Game-Booster-APK
          path: unpacked/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
