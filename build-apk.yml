name: Build SHESHCO Game Space APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'app/**'
      - 'SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project (root or ZIP)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR=.
          elif [[ -f SHESHCO_GAME_BOOSTER/settings.gradle || -f SHESHCO_GAME_BOOSTER/settings.gradle.kts ]]; then
            PROJECT_DIR=SHESHCO_GAME_BOOSTER
          elif [[ -f SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip ]]; then
            mkdir -p unpacked
            unzip -q SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip -d unpacked
            SETTINGS_FILE="$(find unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "::error::Library/project file not found: ZIP must contain settings.gradle or settings.gradle.kts."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            echo "::error::Android project not found. Upload the extracted project files (app/, settings.gradle, build.gradle) to repository root, or upload SHESHCO_GAME_BOOSTER_MOBILE_BUILD.zip."
            exit 1
          fi
          if [[ ! -d "$PROJECT_DIR/app/src/main" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android app module files are missing in $PROJECT_DIR."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHESHCO-Game-Space-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
